
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Data Table</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid black;
            text-align: center;
            padding: 8px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <button onclick="jawwad()">Show Students</button>
    <table id="student">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone Number</th>
                <th>Address</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        const students = [
            { name: "Jawwad", phone: "03001234567", address: "Karachi", grade: "A" },
            { name: "Ahmad", phone: "03111234567", address: "Karachi", grade: "B" },
            { name: "Noor", phone: "03221234567", address: "Islamabad", grade: "A+" },
            { name: "Sheikd", phone: "03331234567", address: "Karachi", grade: "B+" }
        ];
 
        function jawwad() {
            const tableBody = document.querySelector("#student tbody");
            tableBody.innerHTML = ""; 

            for (let i = 0; i < students.length; i++) {
                const student = students[i];
                const row = `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.phone}</td>
                        <td>${student.address}</td>
                        <td>${student.grade}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            }
        }
    </script>

</body>
</html>

</body>
</html>
